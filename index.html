<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall Blood Donor</title><meta name="description" content="Find available blood donors."><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">🩸 Hall Blood Donor</div><nav class="nav"><a class="admin-link" href="admin.html">Admin</a></nav></header>
<main><section class="hero"><p class="eyebrow">HALL BLOOD DONOR DIRECTORY</p><h1>Find a blood donor quickly.</h1><p>Search by blood group, city, availability, and donation location.</p></section>
<section class="search-card"><div class="field"><label>Blood group</label><select id="blood"><option value="">All groups</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label>City / District</label><select id="city"><option value="">All locations</option><option value="Dhaka">Dhaka</option></select></div><div class="field"><label>Specific location</label><input id="location" placeholder="e.g. Zahurul Huq Hall"></div><div class="field"><label>Availability</label><select id="status"><option value="available">Available</option><option value="">All</option><option value="unavailable">Unavailable</option></select></div><div class="field"><label>Sort</label><select id="sort"><option value="available">Available first</option><option value="blood">Blood group</option><option value="location">Location</option><option value="recent">Recently verified</option></select></div></section>
<section class="results-head"><h2>Donors</h2><span id="count"></span></section><section id="results" class="grid"></section></main>
<footer>Use donor information responsibly. Confirm availability before contacting a donor.</footer>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
