<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Hall Blood Donor Directory</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase configuration -->
  <script src="config.js"></script>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>Hall Blood Donor Directory</h1>
      <p>Find blood donors from the hall community.</p>
    </div>
  </header>

  <main class="container">

    <section class="filters">

      <div class="field">
        <label for="blood">Blood group</label>
        <select id="blood">
          <option value="">All blood groups</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <div class="field">
        <label for="city">City / District</label>
        <select id="city">
          <option value="">All cities / districts</option>
          <option value="Dhaka">Dhaka</option>
          <option value="Chattogram">Chattogram</option>
          <option value="Rajshahi">Rajshahi</option>
          <option value="Khulna">Khulna</option>
          <option value="Barishal">Barishal</option>
          <option value="Sylhet">Sylhet</option>
          <option value="Rangpur">Rangpur</option>
          <option value="Mymensingh">Mymensingh</option>
          <option value="Cumilla">Cumilla</option>
          <option value="Gazipur">Gazipur</option>
          <option value="Narayanganj">Narayanganj</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="location">Specific location</label>
        <input
          id="location"
          type="text"
          placeholder="Optional, e.g. Zahurul Huq Hall"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label for="status">Availability</label>
        <select id="status">
          <option value="">All</option>
          <option value="available">Available</option>
          <option value="unavailable">Unavailable</option>
        </select>
      </div>

      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="available">Availability</option>
          <option value="blood">Blood group</option>
          <option value="location">Location</option>
          <option value="recent">Recently verified</option>
        </select>
      </div>

    </section>

    <section class="results-header">
      <h2>Donors</h2>
      <span id="count">0 donors</span>
    </section>

    <section id="results" class="results" aria-live="polite">
      <div class="card">
        <strong>Loading donors...</strong>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>
        Please confirm donor eligibility and availability before contacting a donor.
      </p>
    </div>
  </footer>

  <script src="app.js"></script>

</body>
</html>
