<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>BADHAN ZH</title>

  <meta
    name="description"
    content="Find blood donors by blood group, city, availability, and donation location."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="topbar">

    <div class="brand">
      🩸 BADHAN ZH
    </div>

    <nav class="nav">
      <a
        class="admin-link"
        href="admin.html"
      >
        Admin
      </a>
    </nav>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <!-- ===================================================
         HERO
         =================================================== -->

    <section class="hero">

      <p class="eyebrow">
        BADHAN ZH BLOOD DONOR DIRECTORY
      </p>

      <h1>
        Find a blood donor quickly.
      </h1>

      <p>
        Search by blood group, city, availability,
        and donation location.
      </p>

    </section>


    <!-- ===================================================
         SEARCH / FILTER CARD
         =================================================== -->

    <section class="search-card">

      <!-- Blood Group -->

      <div class="field">

        <label for="blood">
          Blood group
        </label>

        <select id="blood">

          <option value="">
            All groups
          </option>

          <option value="A+">
            A+
          </option>

          <option value="A-">
            A-
          </option>

          <option value="B+">
            B+
          </option>

          <option value="B-">
            B-
          </option>

          <option value="AB+">
            AB+
          </option>

          <option value="AB-">
            AB-
          </option>

          <option value="O+">
            O+
          </option>

          <option value="O-">
            O-
          </option>

        </select>

      </div>


      <!-- =================================================
           CITY / DISTRICT
           ================================================= -->

      <div class="field">

        <label for="city">
          City / District
        </label>

        <select id="city">

          <!--
            app.js will automatically populate
            the available cities/districts from
            the donor database.
          -->

          <option value="">
            All locations
          </option>

        </select>

      </div>


      <!-- =================================================
           SPECIFIC LOCATION
           ================================================= -->

      <div class="field">

        <label for="location">
          Specific location
        </label>

        <input
          id="location"
          type="text"
          placeholder="e.g. Zahurul Huq Hall"
          autocomplete="off"
        >

      </div>


      <!-- =================================================
           AVAILABILITY
           ================================================= -->

      <div class="field">

        <label for="status">
          Availability
        </label>

        <select id="status">

          <!-- Default: show available donors -->

          <option value="available">
            Available
          </option>

          <!-- Show both available and unavailable -->

          <option value="">
            All
          </option>

          <!-- Show only unavailable -->

          <option value="unavailable">
            Unavailable
          </option>

        </select>

      </div>


      <!-- =================================================
           SORT
           ================================================= -->

      <div class="field">

        <label for="sort">
          Sort
        </label>

        <select id="sort">

          <option value="available">
            Available first
          </option>

          <option value="blood">
            Blood group
          </option>

          <option value="location">
            Location
          </option>

          <option value="recent">
            Recently verified
          </option>

        </select>

      </div>

    </section>


    <!-- ===================================================
         RESULTS HEADER
         =================================================== -->

    <section class="results-head">

      <h2>
        Donors
      </h2>

      <span id="count">
        0 donors
      </span>

    </section>


    <!-- ===================================================
         DONOR RESULTS
         =================================================== -->

    <section
      id="results"
      class="grid"
    >

      <!-- Initial loading message -->

      <div class="empty-state">

        <strong>
          Loading donors...
        </strong>

        <p>
          Please wait.
        </p>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer>

    Use donor information responsibly.
    Confirm availability before contacting a donor.

  </footer>


  <!-- =====================================================
       CONFIGURATION
       ===================================================== -->

  <script src="config.js"></script>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <!--
    Change the version number whenever necessary
    to prevent browser cache from loading an old app.js.
  -->

  <script src="app.js?v=20260927-5"></script>

</body>
</html>
