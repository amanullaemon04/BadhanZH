<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মতামত দিন - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Feedback Card - Sheer Glass Transparency */
    .feedback-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius);
      padding: 22px 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .form-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .form-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* Transparent Inputs & Textarea */
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 8px;
      font-size: 0.96rem;
      font-weight: 500;
      background-color: rgba(255, 255, 255, 0.45);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-group input {
      height: 48px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      background-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 3px 10px rgba(211, 47, 47, 0.25);
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" class="logo" style="text-decoration: none;">🩸 BADHAN ZH</a>
        <div class="header-actions">
          <a href="index.html" class="admin-link">← হোম পেজ</a>
        </div>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="feedback-card">
      <h2 class="form-title">ওয়েবসাইট সম্পর্কে আপনার মতামত দিন</h2>
      <p class="form-subtitle">BADHAN ZH প্ল্যাটফর্মটি আরও উন্নত করতে আপনার মূল্যবান মতামত ও পরামর্শ জানান।</p>
      
      <form id="feedbackForm">
        <div class="form-group">
          <label for="name">আপনার নাম *</label>
          <input type="text" id="name" placeholder="e.g. Amanulla Emon" required />
        </div>

        <div class="form-group">
          <label for="contact">মোবাইল বা ইমেইল (ঐচ্ছিক)</label>
          <input type="text" id="contact" placeholder="01XXXXXXXXX বা email" />
        </div>

        <div class="form-group">
          <label for="message">আপনার মতামত বা পরামর্শ *</label>
          <textarea id="message" placeholder="আপনার মতামত বিস্তারিত লিখুন..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">মতামত জমা দিন</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — আপনার মতামত আমাদের অনুপ্রেরণা</p>
      <p class="footer-credit">
        Designed & Developed by <a href="developer.html">Amanulla Emon</a>
      </p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "অপেক্ষা করুন...";

      const feedbackData = {
        name: document.getElementById('name').value.trim(),
        contact: document.getElementById('contact').value.trim() || null,
        message: document.getElementById('message').value.trim()
      };

      try {
        const { error } = await supabaseClient.from('feedback').insert([feedbackData]);
        if (error) throw error;
        alert("আপনার মতামত সফলভাবে জমা হয়েছে! ধন্যবাদ।");
        document.getElementById('feedbackForm').reset();
      } catch (err) {
        alert("ত্রুটি হয়েছে: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "মতামত জমা দিন";
      }
    });
  </script>
</body>
</html>
