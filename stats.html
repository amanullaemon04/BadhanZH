<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রক্তের পরিসংখ্যান - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Stats Card - Sheer Glass Transparency */
    .stats-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .stats-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Individual Blood Group Box - Sheer Glass */
    .stat-box {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(3px);
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }

    .stat-box:hover {
      background: rgba(255, 255, 255, 0.7);
      border-color: var(--primary);
    }

    .stat-blood {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .stat-count {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" class="logo" style="text-decoration: none;">🩸 BADHAN ZH</a>
        <div class="header-actions">
          <a href="index.html" class="admin-link">← হোম পেজ</a>
        </div>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="stats-card">
      <h2 class="stats-title">রক্তের গ্রুপভিত্তিক পরিসংখ্যান</h2>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-blood">A+</div>
          <div class="stat-count" id="count-A-pos">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">A-</div>
          <div class="stat-count" id="count-A-neg">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">B+</div>
          <div class="stat-count" id="count-B-pos">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">B-</div>
          <div class="stat-count" id="count-B-neg">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">AB+</div>
          <div class="stat-count" id="count-AB-pos">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">AB-</div>
          <div class="stat-count" id="count-AB-neg">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">O+</div>
          <div class="stat-count" id="count-O-pos">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-blood">O-</div>
          <div class="stat-count" id="count-O-neg">0</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — রিয়েল-টাইম ডাটা আপডেট</p>
      <p class="footer-credit">
        Designed & Developed by <a href="developer.html">Amanulla Emon</a>
      </p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadStats() {
      try {
        const { data, error } = await supabaseClient
          .from('donors')
          .select('blood_group, verified');

        if (error) throw error;

        // Group counting
        const counts = {
          "A+": 0, "A-": 0,
          "B+": 0, "B-": 0,
          "AB+": 0, "AB-": 0,
          "O+": 0, "O-": 0
        };

        if (data) {
          data.forEach(donor => {
            // Count verified donors or all valid groups
            const bg = (donor.blood_group || "").trim().toUpperCase();
            if (counts.hasOwnProperty(bg)) {
              counts[bg]++;
            }
          });
        }

        // Map to IDs
        document.getElementById('count-A-pos').textContent = counts["A+"];
        document.getElementById('count-A-neg').textContent = counts["A-"];
        document.getElementById('count-B-pos').textContent = counts["B+"];
        document.getElementById('count-B-neg').textContent = counts["B-"];
        document.getElementById('count-AB-pos').textContent = counts["AB+"];
        document.getElementById('count-AB-neg').textContent = counts["AB-"];
        document.getElementById('count-O-pos').textContent = counts["O+"];
        document.getElementById('count-O-neg').textContent = counts["O-"];

      } catch (err) {
        console.error("Error loading stats:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
