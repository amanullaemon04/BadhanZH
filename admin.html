<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      margin-top: 6px;
    }

    .tab-btn {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(211, 47, 47, 0.25);
    }

    .search-box {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 8px;
      font-size: 0.92rem;
      background-color: rgba(255, 255, 255, 0.55);
      margin-bottom: 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .admin-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(3px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-card-header h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .admin-details {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .admin-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    .action-btn {
      flex: 1;
      height: 34px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
    }

    .btn-verify {
      background: rgba(22, 163, 74, 0.15);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.4);
    }

    .btn-verified {
      background: #dcfce7;
      color: var(--success);
      font-weight: 700;
      cursor: default;
    }

    .btn-delete {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.35);
      max-width: 90px;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      padding: 24px 18px;
      margin-top: 14px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .login-input {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
    }

    .login-input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .btn-login-submit {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(211, 47, 47, 0.25);
    }

    .btn-login-submit:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Unified Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">BADHAN</span>
          <span class="logo-zh-badge">ZH</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← মেইন সাইট</a>
        <button onclick="logoutAdmin()" class="nav-chip" id="logoutBtn" style="cursor: pointer; background: rgba(220, 38, 38, 0.12); color: #dc2626; border-color: rgba(220, 38, 38, 0.35); display: none;">Logout</button>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Email & Password Login Section -->
    <div id="loginSection" class="login-card">
      <h2 style="color: var(--primary); font-size: 1.25rem; font-weight: 800; margin-bottom: 4px;">অ্যাডমিন প্যানেল লগইন</h2>
      <p style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 16px;">আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড প্রদান করুন</p>
      
      <form onsubmit="handleAdminLogin(event)">
        <input type="email" id="adminEmail" class="login-input" placeholder="অ্যাডমিন ইমেইল (Email)..." required />
        <input type="password" id="adminPassword" class="login-input" placeholder="পাসওয়ার্ড (Password)..." required />
        <button type="submit" class="btn-login-submit" id="loginBtn">লগইন করুন</button>
      </form>
    </div>

    <!-- Admin Panel Content Section -->
    <div id="adminPanel" style="display: none;">
      <h2 style="font-size: 1.2rem; font-weight: 800; color: var(--primary); text-align: center; margin: 8px 0 6px 0;">অ্যাডমিন কন্ট্রোল</h2>

      <div class="admin-controls">
        <button class="tab-btn active" id="tabDonors" onclick="switchTab('donors')">👥 ডোনার ম্যানেজমেন্ট</button>
        <button class="tab-btn" id="tabReports" onclick="switchTab('reports')">⚠️ রিপোর্ট ও মতামত</button>
      </div>

      <input type="text" id="adminSearch" class="search-box" placeholder="নাম, হল, রক্ত বা জেলা দিয়ে সার্চ করুন..." oninput="filterAdminList()" />

      <div id="adminContentList"></div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — অ্যাডমিন কন্ট্রোল প্যানেল</p>
      <p class="footer-credit">
        Designed & Developed by <a href="developer.html">Amanulla Emon</a>
      </p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'donors';
    let allDonorsCache = [];
    let allReportsCache = [];

    // Calculate Availability matching Home Page logic (90 days rule)
    function getDonationStatus(donor) {
      let isAvailable = true;
      let nextDateStr = null;

      if (donor.last_donation) {
        const donationDate = new Date(donor.last_donation);
        if (!isNaN(donationDate.getTime())) {
          const nextEligibleDate = new Date(donationDate);
          nextEligibleDate.setDate(nextEligibleDate.getDate() + 90);

          const today = new Date();
          if (today < nextEligibleDate) {
            isAvailable = false;
            nextDateStr = nextEligibleDate.toISOString().split("T")[0];
          }
        }
      }

      if (donor.status && donor.status.toLowerCase() === "unavailable") {
        isAvailable = false;
      }

      if (donor.status && donor.status.toLowerCase() === "available" && donor.phone === "01608575239") {
        isAvailable = true;
      }

      return { isAvailable, nextDateStr };
    }

    // Supabase Email & Password Auth
    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = "যাচাই করা হচ্ছে...";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;
        showAdminPanel();
      } catch (err) {
        alert("লগইন ব্যর্থ হয়েছে: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "লগইন করুন";
      }
    }

    async function logoutAdmin() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    function showAdminPanel() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'inline-flex';
      loadAdminData();
    }

    async function checkCurrentSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showAdminPanel();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabDonors').classList.toggle('active', tab === 'donors');
      document.getElementById('tabReports').classList.toggle('active', tab === 'reports');
      
      const searchBox = document.getElementById('adminSearch');
      searchBox.placeholder = tab === 'donors' 
        ? "নাম, হল, রক্ত বা জেলা দিয়ে সার্চ করুন..." 
        : "রিপোর্টের কারণ বা ডোনারের নাম দিয়ে খুঁজুন...";
      searchBox.value = "";
      
      renderAdminList();
    }

    async function loadAdminData() {
      const listContainer = document.getElementById('adminContentList');
      listContainer.innerHTML = `<div class="no-results">ডাটা লোড হচ্ছে...</div>`;

      try {
        const { data: donorsData, error: dError } = await supabaseClient
          .from('donors')
          .select('*')
          .order('id', { ascending: false });
        if (dError) throw dError;
        allDonorsCache = donorsData || [];

        const { data: reportsData } = await supabaseClient
          .from('reports')
          .select('*')
          .order('id', { ascending: false });
        allReportsCache = reportsData || [];

        renderAdminList();
      } catch (err) {
        listContainer.innerHTML = `<div class="no-results" style="color: var(--danger);">ত্রুটি: ${err.message}</div>`;
      }
    }

    function renderAdminList() {
      const listContainer = document.getElementById('adminContentList');
      const query = document.getElementById('adminSearch').value.trim().toLowerCase();

      if (currentTab === 'donors') {
        let donors = allDonorsCache;
        if (query) {
          donors = donors.filter(d => 
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.blood_group && d.blood_group.toLowerCase().includes(query)) ||
            (d.location && d.location.toLowerCase().includes(query)) ||
            (d.city && d.city.toLowerCase().includes(query))
          );
        }

        if (donors.length === 0) {
          listContainer.innerHTML = `<div class="no-results">কোনো ডোনার পাওয়া যায়নি।</div>`;
          return;
        }

        listContainer.innerHTML = donors.map(d => {
          const { isAvailable, nextDateStr } = getDonationStatus(d);
          const statusText = isAvailable ? "AVAILABLE" : "UNAVAILABLE";
          const statusColor = isAvailable ? "var(--success)" : "var(--danger)";

          let nextDateInfo = "";
          if (!isAvailable && nextDateStr) {
            nextDateInfo = ` <span style="font-size:0.75rem; color:#b91c1c;">(পরবর্তী: ${escapeHtml(nextDateStr)})</span>`;
          }

          return `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3>${escapeHtml(d.name)}</h3>
                <span class="blood-badge">${escapeHtml(d.blood_group)}</span>
              </div>
              <div class="admin-details">
                <div>📞 মোবাইল: <strong>${escapeHtml(d.phone)}</strong></div>
                <div>📍 জেলা: <strong>${escapeHtml(d.city || '')} (${escapeHtml(d.location || '')})</strong></div>
                <div>🗓️ শেষ রক্তদান: <strong>${escapeHtml(d.last_donation || 'তথ্য নেই')}</strong></div>
                <div>⚡ প্রাপ্যতা: <strong style="color: ${statusColor};">${statusText}</strong>${nextDateInfo}</div>
              </div>
              <div class="admin-card-actions">
                ${d.verified 
                  ? `<span class="action-btn btn-verified">অনুমোদিত (Verified)</span>` 
                  : `<button onclick="verifyDonor('${d.id}')" class="action-btn btn-verify">অনুমোদন দিন</button>`
                }
                <button onclick="toggleDonorStatus('${d.id}', ${isAvailable})" class="action-btn" style="background: rgba(59, 130, 246, 0.15); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.4);">
                  ${isAvailable ? 'Make Unavailable' : 'Make Available'}
                </button>
                <button onclick="deleteDonor('${d.id}')" class="action-btn btn-delete">Delete</button>
              </div>
            </div>
          `;
        }).join('');

      } else {
        let reports = allReportsCache;
        if (query) {
          reports = reports.filter(r => 
            (r.donor_name && r.donor_name.toLowerCase().includes(query)) ||
            (r.reason && r.reason.toLowerCase().includes(query))
          );
        }

        if (reports.length === 0) {
          listContainer.innerHTML = `<div class="no-results">কোনো রিপোর্ট বা মতামত নেই।</div>`;
          return;
        }

        listContainer.innerHTML = reports.map(r => `
          <div class="admin-card">
            <div class="admin-card-header">
              <h3>${escapeHtml(r.donor_name || 'Anonymous')}</h3>
              <span class="blood-badge" style="background: #fee2e2; color: #dc2626;">Report</span>
            </div>
            <div class="admin-details">
              <div>📞 মোবাইল: <strong>${escapeHtml(r.donor_phone || 'N/A')}</strong></div>
              <div>📝 অভিযোগ/কারণ: <strong>${escapeHtml(r.reason)}</strong></div>
              <div>🕒 তারিখ: <strong>${new Date(r.created_at).toLocaleDateString('bn-BD')}</strong></div>
            </div>
            <div class="admin-card-actions">
              <button onclick="deleteReport('${r.id}')" class="action-btn btn-delete" style="max-width: 100%;">মুছে ফেলুন</button>
            </div>
          </div>
        `).join('');
      }
    }

    function filterAdminList() {
      renderAdminList();
    }

    async function verifyDonor(id) {
      try {
        const { error } = await supabaseClient.from('donors').update({ verified: true }).eq('id', id);
        if (error) throw error;
        loadAdminData();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    }

    async function toggleDonorStatus(id, currentIsAvailable) {
      const nextStatus = currentIsAvailable ? 'unavailable' : 'available';
      try {
        const { error } = await supabaseClient.from('donors').update({ status: nextStatus }).eq('id', id);
        if (error) throw error;
        loadAdminData();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    }

    async function deleteDonor(id) {
      if (!confirm("আপনি কি নিশ্চিতভাবে এই ডোনারের তথ্য মুছে ফেলতে চান?")) return;
      try {
        const { error } = await supabaseClient.from('donors').delete().eq('id', id);
        if (error) throw error;
        loadAdminData();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    }

    async function deleteReport(id) {
      if (!confirm("রিপোর্টটি মুছে ফেলতে চান?")) return;
      try {
        const { error } = await supabaseClient.from('reports').delete().eq('id', id);
        if (error) throw error;
        loadAdminData();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    checkCurrentSession();
  </script>
</body>
  </html>
