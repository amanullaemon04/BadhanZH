<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-card-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-search-box:focus {
      border-color: var(--primary);
    }
    /* Donor item card matching original design */
    .admin-donor-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-donor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-donor-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .admin-donor-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .admin-donor-info strong {
      color: var(--text-main);
    }
    .admin-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }
    .btn-action-group {
      display: flex;
      gap: 8px;
    }
    .btn-approve {
      background: var(--success);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-remove {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-remove:hover {
      background: var(--danger);
      color: #ffffff;
    }
    .btn-approve:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" class="logo" style="text-decoration: none;">🩸 BADHAN ZH – Admin</a>
        <div class="header-actions">
          <a href="index.html" class="admin-link">← মেইন সাইট</a>
          <button id="btnLogout" class="admin-link" style="display: none; cursor: pointer;">Logout</button>
        </div>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Login Section -->
    <div id="loginSection" class="form-card" style="margin: 20px auto 0; width: 100%;">
      <h2 class="form-title">অ্যাডমিন লগইন</h2>
      <form id="loginForm" class="filter-grid">
        <div class="filter-group">
          <label>ইমেইল (Email)</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" required autocomplete="username" />
        </div>
        <div class="filter-group">
          <label>পাসওয়ার্ড (Password)</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" id="btnLogin" class="submit-btn">লগইন করুন</button>
      </form>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="dashboardSection" class="admin-card-container" style="display: none; margin-top: 10px;">
      <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--primary); text-align: center;">ডোনার ম্যানেজমেন্ট</h2>

      <!-- Search Input -->
      <input 
        type="text" 
        id="adminSearch" 
        class="admin-search-box" 
        placeholder="নাম, রক্ত বা জেলা দিয়ে সার্চ করুন..." 
      />

      <!-- Donor Cards List -->
      <div id="adminDonorList" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Dynamic donor cards load here -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — অ্যাডমিন কন্ট্রোল প্যানেল</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const btnLogout = document.getElementById("btnLogout");

    // Session verification
    async function checkAuth() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        showDashboard();
      }
    }
    checkAuth();

    // Login process
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.innerText = "যাচাই হচ্ছে...";

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          alert("লগইন ব্যর্থ হয়েছে: " + error.message);
          btn.disabled = false;
          btn.innerText = "লগইন করুন";
        } else if (data.session) {
          showDashboard();
        }
      } catch (err) {
        alert("নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।");
        btn.disabled = false;
        btn.innerText = "লগইন করুন";
      }
    });

    // Logout
    btnLogout.addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.reload();
    });

    function showDashboard() {
      loginSection.style.display = "none";
      dashboardSection.style.display = "flex";
      btnLogout.style.display = "inline-flex";
      loadDonors();
    }

    // Load Donors
    async function loadDonors() {
      const container = document.getElementById("adminDonorList");
      container.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding:20px;'>লোড হচ্ছে...</p>";

      const { data, error } = await client.from("donors").select("*").order("created_at", { ascending: false });

      if (error || !data) {
        container.innerHTML = "<p style='text-align:center; color:var(--danger); padding:20px;'>ডাটা লোড করা যায়নি!</p>";
        return;
      }

      renderDonors(data);

      // Realtime search
      document.getElementById("adminSearch").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = data.filter(d => 
          (d.name && d.name.toLowerCase().includes(term)) || 
          (d.blood && d.blood.toLowerCase().includes(term)) || 
          (d.city && d.city.toLowerCase().includes(term)) ||
          (d.phone && d.phone.includes(term))
        );
        renderDonors(filtered);
      });
    }

    // Render donor cards
    function renderDonors(donors) {
      const container = document.getElementById("adminDonorList");
      if (donors.length === 0) {
        container.innerHTML = "<p class='no-results'>কোনো ডোনারের তথ্য পাওয়া যায়নি।</p>";
        return;
      }

      container.innerHTML = donors.map(d => `
        <div class="admin-donor-card">
          <div class="admin-donor-header">
            <span class="admin-donor-name">${d.name || 'অজ্ঞাত'}</span>
            <span class="blood-badge">${d.blood || '-'}</span>
          </div>

          <div class="admin-donor-info">
            <div>📞 মোবাইল: <strong><a href="tel:${d.phone}" style="color:var(--text-main); text-decoration:none;">${d.phone || '-'}</a></strong></div>
            <div>📍 জেলা: <strong>${d.city || '-'}</strong> ${d.location ? `(${d.location})` : ''}</div>
            ${d.last_donation ? `<div>🗓️ শেষ রক্তদান: <strong>${d.last_donation}</strong></div>` : ''}
          </div>

          <div class="admin-card-actions">
            <div>
              ${d.verified 
                ? '<span class="donor-status status-available">অনুমোদিত (Verified)</span>' 
                : '<span class="donor-status status-unavailable">অপেক্ষমান (Pending)</span>'}
            </div>
            <div class="btn-action-group">
              ${!d.verified ? `<button class="btn-approve" onclick="verifyDonor('${d.id}')">Approve</button>` : ''}
              <button class="btn-remove" onclick="deleteDonor('${d.id}')">Delete</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    // Approve
    window.verifyDonor = async (id) => {
      if (confirm("এই ডোনারকে অনুমোদন করতে চান?")) {
        await client.from("donors").update({ verified: true }).eq("id", id);
        loadDonors();
      }
    };

    // Delete
    window.deleteDonor = async (id) => {
      if (confirm("আপনি কি নিশ্চিতভাবে এই ডোনারের তথ্য মুছে ফেলতে চান?")) {
        await client.from("donors").delete().eq("id", id);
        loadDonors();
      }
    };
  </script>
</body>
</html>
