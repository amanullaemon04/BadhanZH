<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      padding: 20px;
    }
    .admin-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }
    .admin-controls {
      margin-bottom: 16px;
    }
    .admin-table-wrap {
      overflow-x: auto;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }
    .admin-table th, .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .admin-table th {
      background-color: #f8fafc;
      color: var(--text-muted);
      font-weight: 700;
    }
    .action-btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-verify {
      background: var(--success);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-delete {
      background: var(--danger);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" class="logo" style="text-decoration: none;">🩸 BADHAN ZH – Admin</a>
        <div class="header-actions">
          <a href="index.html" class="admin-link">← মেইন সাইট</a>
          <button id="btnLogout" class="admin-link" style="display: none; cursor: pointer;">Logout</button>
        </div>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Login Form Card -->
    <div id="loginSection" class="form-card">
      <h2 class="form-title">অ্যাডমিন লগইন</h2>
      <form id="loginForm" class="filter-grid">
        <div class="filter-group">
          <label>ইমেইল (Email)</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" required autocomplete="username" />
        </div>
        <div class="filter-group">
          <label>পাসওয়ার্ড (Password)</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" id="btnLogin" class="submit-btn">লগইন করুন</button>
      </form>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="dashboardSection" class="admin-card" style="display: none; width: 100%;">
      <h2 class="admin-title">ডোনার ম্যানেজমেন্ট</h2>
      
      <div class="admin-controls">
        <input 
          type="text" 
          id="adminSearch" 
          placeholder="নাম, রক্ত বা জেলা দিয়ে সার্চ করুন..." 
          style="width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem;" 
        />
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>নাম</th>
              <th>গ্রুপ</th>
              <th>মোবাইল</th>
              <th>জেলা</th>
              <th>অবস্থা</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="adminDonorList">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — অ্যাডমিন কন্ট্রোল প্যানেল</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const btnLogout = document.getElementById("btnLogout");

    // Check active session on load
    async function checkAuth() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        showDashboard();
      }
    }
    checkAuth();

    // Login Form Submit
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.innerText = "যাচাই হচ্ছে...";

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("লগইন ব্যর্থ হয়েছে: " + (error.message || "ইমেইল বা পাসওয়ার্ড সঠিক নয়"));
          btn.disabled = false;
          btn.innerText = "লগইন করুন";
        } else if (data.session) {
          showDashboard();
        }
      } catch (err) {
        alert("নেটওয়ার্ক বা সিস্টেম ত্রুটি। আবার চেষ্টা করুন।");
        btn.disabled = false;
        btn.innerText = "লগইন করুন";
      }
    });

    // Logout
    btnLogout.addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.reload();
    });

    function showDashboard() {
      loginSection.style.display = "none";
      dashboardSection.style.display = "block";
      btnLogout.style.display = "inline-flex";
      loadDonors();
    }

    // Load Donors
    async function loadDonors() {
      const tbody = document.getElementById("adminDonorList");
      tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 16px;'>লোড হচ্ছে...</td></tr>";

      const { data, error } = await client.from("donors").select("*").order("created_at", { ascending: false });

      if (error || !data) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color: var(--danger); padding: 16px;'>ডাটা লোড করা যায়নি!</td></tr>";
        return;
      }

      renderTable(data);

      document.getElementById("adminSearch").addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = data.filter(d => 
          (d.name && d.name.toLowerCase().includes(term)) || 
          (d.blood && d.blood.toLowerCase().includes(term)) || 
          (d.city && d.city.toLowerCase().includes(term))
        );
        renderTable(filtered);
      });
    }

    function renderTable(donors) {
      const tbody = document.getElementById("adminDonorList");
      if (donors.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 16px;'>কোনো ডোনার পাওয়া যায়নি।</td></tr>";
        return;
      }

      tbody.innerHTML = donors.map(d => `
        <tr>
          <td><strong>${d.name || '-'}</strong></td>
          <td><span style="color:var(--primary); font-weight:800;">${d.blood || '-'}</span></td>
          <td><a href="tel:${d.phone}" style="color:var(--text-main); text-decoration:none; font-weight:600;">${d.phone || '-'}</a></td>
          <td>${d.city || '-'}</td>
          <td>${d.verified ? '<span style="color:var(--success); font-weight:700;">Verified</span>' : '<span style="color:var(--danger); font-weight:700;">Pending</span>'}</td>
          <td>
            <div class="action-btn-group">
              ${!d.verified ? `<button class="btn-verify" onclick="verifyDonor('${d.id}')">Approve</button>` : ''}
              <button class="btn-delete" onclick="deleteDonor('${d.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    window.verifyDonor = async (id) => {
      if (confirm("এই ডোনারকে অনুমোদন করতে চান?")) {
        await client.from("donors").update({ verified: true }).eq("id", id);
        loadDonors();
      }
    };

    window.deleteDonor = async (id) => {
      if (confirm("এই ডোনারের তথ্য মুছে ফেলতে চান?")) {
        await client.from("donors").delete().eq("id", id);
        loadDonors();
      }
    };
  </script>
</body>
</html>
