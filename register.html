<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রক্তদাতা রেজিস্ট্রেশন - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .register-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius);
      padding: 16px 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .form-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 10px;
    }
    .form-group label {
      font-size: 0.84rem;
      font-weight: 700;
      color: #1e293b;
    }
    .form-group input, .form-group select {
      width: 100%;
      height: 38px;
      padding: 6px 12px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: rgba(255, 255, 255, 0.45);
      color: var(--text-main);
      outline: none;
    }
    .btn-submit {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">BADHAN</span>
          <span class="logo-zh-badge">ZH</span>
        </a>
      </div>
      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← হোম পেজ</a>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="register-card">
      <h2 class="form-title">রক্তদাতা রেজিস্ট্রেশন</h2>
      <form id="donorForm">
        <div class="form-group">
          <label for="name">আপনার পুরো নাম *</label>
          <input type="text" id="name" placeholder="e.g. Amanulla Emon" required />
        </div>
        <div class="form-group">
          <label for="blood_group">রক্তের গ্রুপ *</label>
          <select id="blood_group" required>
            <option value="">সিলেক্ট করুন</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phone">মোবাইল নম্বর *</label>
          <input type="tel" id="phone" placeholder="01XXXXXXXXX" required />
        </div>
        <div class="form-group">
          <label for="city">জেলা / শহর *</label>
          <select id="city" required>
            <option value="">জেলা নির্বাচন করুন</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Chattogram">Chattogram</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Khulna">Khulna</option>
            <option value="Barishal">Barishal</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Rangpur">Rangpur</option>
            <option value="Mymensingh">Mymensingh</option>
            <option value="Gazipur">Gazipur</option>
            <option value="Narayanganj">Narayanganj</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">নির্দিষ্ট এলাকা / হল / রুম নম্বর</label>
          <input type="text" id="location" placeholder="e.g. Zahurul Huq Hall, Room 24" />
        </div>
        <div class="form-group">
          <label for="last_donation">সর্বশেষ রক্তদানের তারিখ</label>
          <input type="date" id="last_donation" />
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">রেজিস্ট্রেশন সম্পন্ন করুন</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — মানবসেবায় আমরা প্রতিজ্ঞাবদ্ধ</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('donorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "অপেক্ষা করুন...";

      const donorData = {
        name: document.getElementById('name').value.trim(),
        blood_group: document.getElementById('blood_group').value,
        phone: document.getElementById('phone').value.trim(),
        city: document.getElementById('city').value,
        location: document.getElementById('location').value.trim(),
        last_donation: document.getElementById('last_donation').value || null,
        verified: false,
        status: 'available'
      };

      try {
        const { error } = await supabaseClient.from('donors').insert([donorData]);
        if (error) throw error;
        alert("রেজিস্ট্রেশন সফল হয়েছে! অ্যাডমিন রিভিউয়ের পর তথ্য প্রকাশিত হবে।");
        document.getElementById('donorForm').reset();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "রেজিস্ট্রেশন সম্পন্ন করুন";
      }
    });
  </script>
</body>
</html>
