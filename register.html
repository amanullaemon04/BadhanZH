<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রক্তদাতা রেজিস্ট্রেশন - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header with Universal Slogan & Right-Aligned Home button -->
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" class="logo" style="text-decoration: none;">🩸 BADHAN ZH</a>
        <div class="header-actions">
          <a href="index.html" class="admin-link">← হোম পেজ</a>
        </div>
      </div>
      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="form-card">
      <h2 class="form-title">রক্তদাতা রেজিস্ট্রেশন</h2>
      
      <form id="regForm" class="filter-grid">
        <div class="filter-group">
          <label>আপনার পুরো নাম *</label>
          <input type="text" id="name" placeholder="e.g. Amanulla Emon" required />
        </div>

        <div class="filter-group">
          <label>রক্তের গ্রুপ *</label>
          <select id="blood" required>
            <option value="">সিলেক্ট করুন</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>

        <div class="filter-group">
          <label>মোবাইল নম্বর *</label>
          <input type="tel" id="phone" placeholder="01XXXXXXXXX" required />
        </div>

        <div class="filter-group">
          <label>জেলা / শহর *</label>
          <select id="city" required>
            <option value="">জেলা নির্বাচন করুন</option>
            <option value="Bagerhat">Bagerhat</option>
            <option value="Bandarban">Bandarban</option>
            <option value="Barguna">Barguna</option>
            <option value="Barishal">Barishal</option>
            <option value="Bhola">Bhola</option>
            <option value="Bogura">Bogura</option>
            <option value="Brahmanbaria">Brahmanbaria</option>
            <option value="Chandpur">Chandpur</option>
            <option value="Chattogram">Chattogram</option>
            <option value="Chuadanga">Chuadanga</option>
            <option value="Cox's Bazar">Cox's Bazar</option>
            <option value="Cumilla">Cumilla</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Dinajpur">Dinajpur</option>
            <option value="Faridpur">Faridpur</option>
            <option value="Feni">Feni</option>
            <option value="Gaibandha">Gaibandha</option>
            <option value="Gazipur">Gazipur</option>
            <option value="Gopalganj">Gopalganj</option>
            <option value="Habiganj">Habiganj</option>
            <option value="Jamalpur">Jamalpur</option>
            <option value="Jashore">Jashore</option>
            <option value="Jhalokati">Jhalokati</option>
            <option value="Jhenaidah">Jhenaidah</option>
            <option value="Joypurhat">Joypurhat</option>
            <option value="Khagrachhari">Khagrachhari</option>
            <option value="Khulna">Khulna</option>
            <option value="Kishoreganj">Kishoreganj</option>
            <option value="Kurigram">Kurigram</option>
            <option value="Kushtia">Kushtia</option>
            <option value="Lakshmipur">Lakshmipur</option>
            <option value="Lalmonirhat">Lalmonirhat</option>
            <option value="Madaripur">Madaripur</option>
            <option value="Magura">Magura</option>
            <option value="Manikganj">Manikganj</option>
            <option value="Meherpur">Meherpur</option>
            <option value="Moulvibazar">Moulvibazar</option>
            <option value="Munshiganj">Munshiganj</option>
            <option value="Mymensingh">Mymensingh</option>
            <option value="Naogaon">Naogaon</option>
            <option value="Narail">Narail</option>
            <option value="Narayanganj">Narayanganj</option>
            <option value="Narsingdi">Narsingdi</option>
            <option value="Natore">Natore</option>
            <option value="Netrokona">Netrokona</option>
            <option value="Nilphamari">Nilphamari</option>
            <option value="Noakhali">Noakhali</option>
            <option value="Pabna">Pabna</option>
            <option value="Panchagarh">Panchagarh</option>
            <option value="Patuakhali">Patuakhali</option>
            <option value="Pirojpur">Pirojpur</option>
            <option value="Rajbari">Rajbari</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Rangamati">Rangamati</option>
            <option value="Rangpur">Rangpur</option>
            <option value="Satkhira">Satkhira</option>
            <option value="Shariatpur">Shariatpur</option>
            <option value="Sherpur">Sherpur</option>
            <option value="Sirajganj">Sirajganj</option>
            <option value="Sunamganj">Sunamganj</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Tangail">Tangail</option>
            <option value="Thakurgaon">Thakurgaon</option>
          </select>
        </div>

        <div class="filter-group">
          <label>নির্দিষ্ট এলাকা / হল / রুম নম্বর</label>
          <input type="text" id="location" placeholder="e.g. Zahurul Huq Hall, Room 24" />
        </div>

        <div class="filter-group">
          <label>সর্বশেষ রক্তদানের তারিখ (যদি পূর্বে দিয়ে থাকেন)</label>
          <input type="date" id="lastDonation" />
        </div>

        <button type="submit" id="btnSubmit" class="submit-btn">রেজিস্ট্রেশন সম্পন্ন করুন</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — মানবসেবায় আমরা প্রতিজ্ঞাবদ্ধ</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.innerText = "অপেক্ষা করুন...";

      const donor = {
        name: document.getElementById("name").value.trim(),
        blood: document.getElementById("blood").value,
        phone: document.getElementById("phone").value.trim(),
        city: document.getElementById("city").value,
        location: document.getElementById("location").value.trim() || null,
        last_donation: document.getElementById("lastDonation").value || null,
        verified: false
      };

      const { error } = await supabase.from("donors").insert([donor]);

      if (error) {
        alert("ত্রুটি: রেজিস্ট্রেশন সফল হয়নি! আবার চেষ্টা করুন।");
        btn.disabled = false;
        btn.innerText = "রেজিস্ট্রেশন সম্পন্ন করুন";
      } else {
        alert("ধন্যবাদ! আপনার রেজিস্ট্রেশন সফলভাবে সম্পন্ন হয়েছে। অ্যাডমিন ভেরিফিকেশনের পর আপনার নাম প্রদর্শিত হবে।");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
